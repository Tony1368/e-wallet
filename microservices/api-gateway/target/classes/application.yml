server:
  port: 8080
  netty:
    connection-timeout: 30000
    idle-timeout: 30000

jwt:
  secret: ${JWT_SECRET:YourSecretKeyForJWTTokenGenerationAndValidation}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      httpclient:
        connect-timeout: 10000
        response-timeout: 60s
        pool:
          max-connections: 1000
          acquire-timeout: 20000
      default-filters: []
      routes:
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
            
        - id: user-management
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**, /api/v1/admin/users/**
            
        - id: user-tracking
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/admin/tracking/**
            
        - id: wallet-management
          uri: ${WALLET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/wallets/**, /api/v1/admin/wallets/**
            
        - id: transaction-management
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/admin/transactions/**
            
        - id: payment-management
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/transfers/**, /api/v1/rewards/**
            
        - id: accounting-service
          uri: ${ACCOUNTING_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/accounting/**
            
        - id: fraud-service
          uri: ${FRAUD_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/fraud/**, /api/v1/admin/fraud-config/**

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO

server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-auth
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**
            
        - id: user-management
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/v1/users/**, /api/v1/admin/users/**

        - id: user-tracking
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/v1/admin/tracking/**
        
        - id: wallet-management
          uri: ${WALLET_SERVICE_URL}
          predicates:
            - Path=/api/v1/wallets/**, /api/v1/admin/wallets/**
        
        - id: transaction-management
          uri: ${TRANSACTION_SERVICE_URL}
          predicates:
            - Path=/api/v1/transactions/**, /api/v1/admin/transactions/**
        
        - id: payment-management
          uri: ${PAYMENT_SERVICE_URL}
          predicates:
            - Path=/api/v1/payments/**, /api/v1/transfers/**, /api/v1/rewards/**

        - id: accounting-service
          uri: ${ACCOUNTING_SERVICE_URL:http://accounting-service:8085}
          predicates:
            - Path=/api/v1/accounting/**

        - id: fraud-service
          uri: ${FRAUD_SERVICE_URL:http://fraud-detection-service:8086}
          predicates:
            - Path=/api/v1/fraud/**, /api/v1/admin/fraud-config/**

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO

services:
  # PostgreSQL Databases
  user-db:
    image: postgres:16-alpine
    container_name: user-management-db
    environment:
      POSTGRES_DB: user_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    networks:
      - ewallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  wallet-db:
    image: postgres:16-alpine
    container_name: wallet-management-db
    environment:
      POSTGRES_DB: wallet_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - wallet-db-data:/var/lib/postgresql/data
    networks:
      - ewallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  transaction-db:
    image: postgres:16-alpine
    container_name: transaction-management-db
    environment:
      POSTGRES_DB: transaction_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - transaction-db-data:/var/lib/postgresql/data
    networks:
      - ewallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    container_name: payment-management-db
    environment:
      POSTGRES_DB: payment_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      - ewallet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  user-service:
    build:
      context: .
      dockerfile: ./user-management-service/Dockerfile
    container_name: user-management-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/user_management_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-YourSecretKeyForJWTTokenGenerationAndValidation}
      JWT_EXPIRATION_MS: 86400000
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - ewallet-network
    restart: unless-stopped

  wallet-service:
    build:
      context: .
      dockerfile: ./wallet-management-service/Dockerfile
    container_name: wallet-management-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://wallet-db:5432/wallet_management_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      USER_SERVICE_URL: http://user-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
    depends_on:
      wallet-db:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - ewallet-network
    restart: unless-stopped

  transaction-service:
    build:
      context: .
      dockerfile: ./transaction-management-service/Dockerfile
    container_name: transaction-management-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-db:5432/transaction_management_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      WALLET_SERVICE_URL: http://wallet-service:8082
    depends_on:
      transaction-db:
        condition: service_healthy
      wallet-service:
        condition: service_started
    networks:
      - ewallet-network
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: ./payment-management-service/Dockerfile
    container_name: payment-management-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/payment_management_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      WALLET_SERVICE_URL: http://wallet-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
    depends_on:
      payment-db:
        condition: service_healthy
      wallet-service:
        condition: service_started
      transaction-service:
        condition: service_started
    networks:
      - ewallet-network
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: http://user-service:8081
      WALLET_SERVICE_URL: http://wallet-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on:
      - user-service
      - wallet-service
      - transaction-service
      - payment-service
    networks:
      - ewallet-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ewallet-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
    depends_on:
      - api-gateway
    networks:
      - ewallet-network
    restart: unless-stopped

networks:
  ewallet-network:
    driver: bridge

volumes:
  user-db-data:
  wallet-db-data:
  transaction-db-data:
  payment-db-data:

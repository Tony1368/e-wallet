server:
  port: 8081

spring:
  application:
    name: user-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_management_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    jwtSecret: ${JWT_SECRET:YourSecretKeyForJWTTokenGenerationAndValidation}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

services:
  wallet:
    url: ${WALLET_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    enabled: false

exception:
  trace: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hust.thailq: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG

server:
  port: 8082
  tomcat:
    threads:
      max: 400
    max-connections: 2000
    accept-count: 200

spring:
  application:
    name: wallet-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/wallet_management_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: 2000ms
      connect-timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

services:
  user:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  transaction:
    url: ${TRANSACTION_SERVICE_URL:http://localhost:8083}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.hust.thailq: INFO
    io.lettuce.core: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%X{requestId:-no-trace}] %-5level [%logger{20}] - %msg%n"
